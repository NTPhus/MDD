<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1120" viewBox="0 0 1680 1120" role="img" aria-labelledby="title desc">
  <title id="title">Pipeline hệ thống luyện nói tiếng Anh hiện tại</title>
  <desc id="desc">Audio tách thành nhánh Whisper cho transcript và hội thoại Qwen, nhánh wav2vec2-B cho bằng chứng âm học và đối chiếu phát âm. Qwen LoRA chỉ giải thích khác biệt đã được phát hiện.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#7060B5"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#43856A"/></marker>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#31245B" flood-opacity=".10"/></filter>
    <style>
      text{font-family:Arial,'Segoe UI',sans-serif;fill:#29243a}.title{font-size:34px;font-weight:700}.subtitle{font-size:16px;fill:#716b7e}.lane{font-size:19px;font-weight:700;letter-spacing:.5px}.head{font-size:18px;font-weight:700}.body{font-size:15px;fill:#5e596a}.small{font-size:13px;fill:#726d7c}.tag{font-size:12px;font-weight:700;letter-spacing:.5px}.box{filter:url(#shadow);stroke-width:1.5}.connector{fill:none;stroke:#7060B5;stroke-width:2.4;marker-end:url(#arrow)}.optional{fill:none;stroke:#43856A;stroke-width:2.2;stroke-dasharray:7 6;marker-end:url(#arrowGreen)}
    </style>
  </defs>
  <rect width="1680" height="1120" fill="#fbfaff"/>
  <rect x="0" y="0" width="1680" height="105" fill="#f1edfc"/>
  <text x="54" y="52" class="title">Pipeline hệ thống luyện nói tiếng Anh</text>
  <text x="56" y="80" class="subtitle">Luồng runtime hiện tại · ASR và phân tích phát âm là hai nhánh riêng</text>

  <rect x="42" y="126" width="1596" height="512" rx="22" fill="#fff" stroke="#e7e1f4"/>
  <text x="68" y="162" class="lane" fill="#6d58ad">1 · XỬ LÝ MỖI LƯỢT NÓI</text>

  <!-- Inputs and audio split -->
  <rect class="box" x="70" y="283" width="205" height="112" rx="18" fill="#f3efff" stroke="#d8cef4"/>
  <text x="172" y="319" text-anchor="middle" class="head">Mic / audio upload</text>
  <text x="172" y="346" text-anchor="middle" class="body">Audio người dùng</text>
  <text x="172" y="370" text-anchor="middle" class="small">Decode · mono · 16 kHz</text>
  <rect class="box" x="326" y="283" width="190" height="112" rx="18" fill="#f7f5fc" stroke="#ddd7eb"/>
  <text x="421" y="319" text-anchor="middle" class="head">Chuẩn bị audio</text>
  <text x="421" y="346" text-anchor="middle" class="body">Một waveform chung</text>
  <text x="421" y="370" text-anchor="middle" class="small">Tách sang hai nhánh</text>
  <path class="connector" d="M275 339H326"/>
  <path class="connector" d="M516 339H540V240H565"/>
  <path class="connector" d="M516 339H540V475H565"/>

  <!-- ASR lane -->
  <rect class="box" x="565" y="188" width="232" height="105" rx="18" fill="#eee9ff" stroke="#cfc2f1"/>
  <text x="681" y="224" text-anchor="middle" class="head">Whisper small.en</text>
  <text x="681" y="251" text-anchor="middle" class="body">ASR tiếng Anh</text>
  <text x="681" y="274" text-anchor="middle" class="small">Transcript + word timestamps</text>
  <rect class="box" x="850" y="188" width="218" height="105" rx="18" fill="#f8f6ff" stroke="#ded6f2"/>
  <text x="959" y="224" text-anchor="middle" class="head">Transcript</text>
  <text x="959" y="251" text-anchor="middle" class="body">Làm ngữ cảnh hội thoại</text>
  <text x="959" y="274" text-anchor="middle" class="small">Không phải bằng chứng âm vị</text>
  <path class="connector" d="M797 240H850"/>
  <rect class="box" x="1120" y="177" width="230" height="126" rx="18" fill="#eee9ff" stroke="#cfc2f1"/>
  <text x="1235" y="213" text-anchor="middle" class="head">Qwen3-0.6B base</text>
  <text x="1235" y="241" text-anchor="middle" class="body">Hội thoại theo lịch sử</text>
  <text x="1235" y="265" text-anchor="middle" class="small">Nhận text, không nhận audio</text>
  <text x="1235" y="285" text-anchor="middle" class="tag" fill="#6b56aa">LOCAL · TEXT-ONLY</text>
  <path class="connector" d="M1068 240H1120"/>
  <rect class="box" x="1400" y="188" width="202" height="105" rx="18" fill="#edf7f1" stroke="#c5e2d1"/>
  <text x="1501" y="224" text-anchor="middle" class="head">Câu trả lời</text>
  <text x="1501" y="251" text-anchor="middle" class="body">Phát voice TTS</text>
  <text x="1501" y="274" text-anchor="middle" class="small">Highlight chữ theo audio</text>
  <path class="connector" d="M1350 240H1400"/>
  <rect class="box" x="1120" y="330" width="230" height="78" rx="16" fill="#fbf8ff" stroke="#ded6f2"/>
  <text x="1235" y="362" text-anchor="middle" class="head">LoRA ngữ pháp (tùy chọn)</text>
  <text x="1235" y="388" text-anchor="middle" class="small">Sửa câu / gợi ý tự nhiên trong collapse</text>
  <path class="optional" d="M1235 303V330"/>
  <rect x="1400" y="326" width="202" height="82" rx="16" fill="#f4fbf7" stroke="#c5e2d1"/>
  <text x="1501" y="358" text-anchor="middle" class="head">Fluency (tùy chọn)</text>
  <text x="1501" y="384" text-anchor="middle" class="small">Whisper word timings</text>
  <path class="optional" d="M797 269H820V410H1380V367H1400"/>

  <!-- Pronunciation lane -->
  <rect class="box" x="565" y="421" width="232" height="108" rx="18" fill="#f0f8f3" stroke="#c6e3d1"/>
  <text x="681" y="457" text-anchor="middle" class="head">wav2vec2-B</text>
  <text x="681" y="484" text-anchor="middle" class="body">CTC phone / posterior</text>
  <text x="681" y="508" text-anchor="middle" class="small">Bằng chứng âm học của audio</text>
  <rect class="box" x="850" y="421" width="218" height="108" rx="18" fill="#fff9ed" stroke="#eed9ad"/>
  <text x="959" y="455" text-anchor="middle" class="head">Câu tham chiếu</text>
  <text x="959" y="481" text-anchor="middle" class="body">Prompt / người dùng sửa</text>
  <text x="959" y="505" text-anchor="middle" class="small">ASR tự sinh = chưa xác nhận</text>
  <path class="connector" d="M797 475H825V539H1090V475H1120"/>
  <path class="connector" d="M1068 475H1120"/>
  <rect class="box" x="1120" y="429" width="230" height="92" rx="18" fill="#f0f8f3" stroke="#c6e3d1"/>
  <text x="1235" y="465" text-anchor="middle" class="head">Đối chiếu âm học</text>
  <text x="1235" y="492" text-anchor="middle" class="body">CMU variants + ngưỡng</text>
  <text x="1235" y="512" text-anchor="middle" class="small">Có thể báo “chưa đủ bằng chứng”</text>
  <rect class="box" x="1400" y="429" width="202" height="92" rx="18" fill="#fff4f5" stroke="#edc4cc"/>
  <text x="1501" y="465" text-anchor="middle" class="head">Sound details</text>
  <text x="1501" y="492" text-anchor="middle" class="body">Từ cần xem · nghe mẫu</text>
  <text x="1501" y="512" text-anchor="middle" class="small">Người dùng có thể sửa ref</text>
  <path class="connector" d="M1350 475H1400"/>
  <rect class="box" x="1120" y="548" width="230" height="66" rx="16" fill="#edf7f1" stroke="#c5e2d1"/>
  <text x="1235" y="576" text-anchor="middle" class="head">Qwen3 LoRA · phát âm</text>
  <text x="1235" y="599" text-anchor="middle" class="small">Chỉ giải thích lỗi đã gắn cờ</text>
  <path class="optional" d="M1235 521V548"/>
  <path class="optional" d="M1350 581H1376V535H1400"/>
  <text x="1380" y="572" class="small" fill="#43856A">nếu có khác biệt + ref</text>

  <!-- Important boundary -->
  <rect x="70" y="548" width="998" height="78" rx="14" fill="#fff5e8" stroke="#e9c58b" stroke-width="1.6"/>
  <text x="90" y="575" class="tag" fill="#9b5b12">RỦI RO LỚN NHẤT · WAV2VEC2-B BÁO NHẦM NHIỀU</text>
  <text x="90" y="598" class="small">SpeechOcean762: B gắn cờ 173/179 câu được cả 5 chuyên gia chấm đúng.</text>
  <text x="90" y="617" class="small">Calibration trên L2-Arctic-Plus chưa tìm được ngưỡng đạt policy; chưa nên coi cảnh báo là kết luận.</text>

  <!-- Training lane -->
  <rect x="42" y="662" width="1596" height="280" rx="22" fill="#fff" stroke="#e7e1f4"/>
  <text x="68" y="700" class="lane" fill="#6d58ad">2 · TRAINING / MODEL ARTIFACTS</text>
  <rect class="box" x="90" y="748" width="245" height="112" rx="18" fill="#fff9ed" stroke="#eed9ad"/>
  <text x="212" y="785" text-anchor="middle" class="head">L2-Arctic-Plus</text>
  <text x="212" y="812" text-anchor="middle" class="body">Audio + transcript / phone label</text>
  <text x="212" y="837" text-anchor="middle" class="small">Dữ liệu cho nhánh phát âm</text>
  <rect class="box" x="420" y="748" width="290" height="112" rx="18" fill="#f0f8f3" stroke="#c6e3d1"/>
  <text x="565" y="785" text-anchor="middle" class="head">wav2vec2-B fine-tune</text>
  <text x="565" y="812" text-anchor="middle" class="body">CTC phone model</text>
  <text x="565" y="837" text-anchor="middle" class="small">Artifact dùng ở nhánh phân tích</text>
  <path class="connector" d="M335 804H420"/>
  <rect class="box" x="90" y="872" width="245" height="52" rx="15" fill="#f7f5fc" stroke="#ded6f2"/>
  <text x="212" y="904" text-anchor="middle" class="head">Dữ liệu grammar / feedback</text>
  <rect class="box" x="420" y="872" width="290" height="52" rx="15" fill="#eee9ff" stroke="#cfc2f1"/>
  <text x="565" y="904" text-anchor="middle" class="head">Qwen3-0.6B LoRA adapters</text>
  <path class="connector" d="M335 898H420"/>
  <rect x="790" y="748" width="790" height="176" rx="18" fill="#fbfaff" stroke="#e1dced"/>
  <text x="825" y="786" class="head">Đang dùng trong demo</text>
  <circle cx="834" cy="820" r="5" fill="#7060B5"/><text x="850" y="825" class="body">Qwen base: hội thoại; grammar LoRA: sửa câu khi bật tùy chọn.</text>
  <circle cx="834" cy="852" r="5" fill="#43856A"/><text x="850" y="857" class="body">Qwen pronunciation LoRA: giải thích khác biệt âm đã được wav2vec2-B gắn cờ.</text>
  <circle cx="834" cy="884" r="5" fill="#a17b38"/><text x="850" y="889" class="body">Projector: hiện không nằm trong luồng chat runtime.</text>
  <text x="825" y="913" class="small">Training artifacts độc lập; mô hình/adapter chỉ được gọi ở nhánh tương ứng.</text>

  <text x="58" y="988" class="small">Tóm tắt: audio → (Whisper → hội thoại) + (wav2vec2-B → đối chiếu phát âm) → kết quả hiển thị riêng; TTS đọc câu trả lời.</text>
  <text x="58" y="1013" class="small">Lưu ý: transcript ASR sai có thể làm sai tham chiếu. Khi người dùng sửa/xác nhận câu, hệ thống có cơ sở rõ hơn để đối chiếu phát âm.</text>
  <text x="58" y="1070" class="small">Sơ đồ theo mã nguồn local ngày 26/10/2026 · docs/pipeline_report</text>
</svg>
